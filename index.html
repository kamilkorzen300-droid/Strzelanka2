
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#101827">
  <title>strzelankapodmagazynami</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu" class="screen">
    <h1>STRZELANKA<br>POD MAGAZYNAMI</h1>
    <div class="money">🪙 <span id="menuCoins">0</span></div>

    <button onclick="startGame()">GRAJ</button>
    <button onclick="showMaps()">WYBIERZ MAPĘ</button>
    <button onclick="showShop()">SKLEP</button>

    <p>Najlepsza fala: <span id="bestWave">0</span></p>
  </div>

  <div id="maps" class="screen hidden">
    <h2>WYBIERZ MAPĘ</h2>
    <button onclick="selectMap('warehouse')">🏭 MAGAZYNY</button>
    <button onclick="selectMap('city')">🏙️ MIASTO</button>
    <button onclick="selectMap('desert')">🏜️ PUSTYNIA</button>
    <button onclick="selectMap('base')">🪖 BAZA</button>
    <button onclick="backMenu()">WRÓĆ</button>
  </div>

  <div id="shop" class="screen hidden">
    <h2>SKLEP</h2>
    <p>🪙 Monety: <span id="shopCoins">0</span></p>
    <div id="shopItems"></div>
    <button onclick="backMenu()">WRÓĆ</button>
  </div>

  <div id="gameOver" class="screen hidden">
    <h1>KONIEC GRY</h1>
    <p>Dotarłeś do fali: <span id="finalWave">1</span></p>
    <button onclick="startGame()">ZAGRAJ PONOWNIE</button>
    <button onclick="backMenu()">MENU</button>
  </div>

  <div id="hud" class="hidden">
    <div class="topbar">
      <span>❤️ <b id="hp">100</b></span>
      <span>🌊 FALA <b id="wave">1</b>/25</span>
      <span>🪙 <b id="coins">0</b></span>
      <span>🔫 <b id="ammo">30</b></span>
    </div>
    <div id="crosshair">+</div>
    <div id="message"></div>

    <div id="mobileControls">
      <div id="joystick"><div id="stick"></div></div>
      <button id="fire">FIRE</button>
      <button id="reload">R</button>
      <button id="jump">↑</button>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
